<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldNexus</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- INTRO -->
    <div id="intro-screen" class="intro-screen">
        <div class="intro-logo-container">
            <img src="logo.png" alt="GoldNexus" class="intro-logo">
            <div class="intro-logo-glow"></div>
        </div>
        <h1 class="intro-title">GOLDNEXUS</h1>
        <p class="intro-subtitle">PEOPLE • REWARDS • RANKING</p>
        
        <div class="intro-lang-buttons">
            <button onclick="selectLanguage('es')">🇪🇸 Español</button>
            <button onclick="selectLanguage('en')">🇬🇧 English</button>
            <button onclick="selectLanguage('ru')">🇷🇺 Русский</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main-app" class="app-container" style="display: none;">
        <header>
            <div class="logo-container">
                <div class="logo-wrapper">
                    <img src="logo.png" alt="Logo" class="logo">
                    <div class="logo-glow"></div>
                </div>
                <div>
                    <h1 class="glow-text">GOLDNEXUS</h1>
                    <p class="subtitle">PEOPLE • REWARDS • RANKING</p>
                </div>
            </div>
            <button class="lang-btn" onclick="showLanguageSelector()">🌐</button>
        </header>

        <div class="card balance-card">
            <div class="balance-header"><span data-i18n="balance">Saldo Total</span></div>
            <div class="balance-amount">
                <div class="coin-3d"><span>$</span></div>
                <span id="balance">0.00</span> <span class="currency">USDT</span>
            </div>
            <div class="action-buttons">
                <button class="btn-primary" data-i18n="earn_more">Ganar Más</button>
                <button class="btn-primary" id="withdraw-btn" data-i18n="withdraw">Retirar</button>
            </div>
        </div>

        <div class="card">
            <h2 data-i18n="ranking">Ranking Global</h2>
            <div id="ranking-list" class="ranking-list"></div>
        </div>

        <div class="tasks-section">
            <h2 data-i18n="tasks">Tareas de Hoy</h2>
            <div class="task-card">
                <div class="task-icon">📅</div>
                <div class="task-info">
                    <h3 data-i18n="checkin">Check-in Diario</h3>
                    <p class="reward">+1.00 USDT</p>
                </div>
                <button class="btn-claim" id="checkin-btn" data-i18n="claim">Reclamar</button>
            </div>
            <div id="tasks-container"></div>
        </div>
    </div>

    <script src="lang.js"></script>
    <script src="intro.js"></script>
    <script src="app.js"></script>
</body>
              </html>
